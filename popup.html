<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VA Claim Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div id="header">
    <h1>VA Claim Tracker</h1>
    <span id="last-updated"></span>
  </div>

  <div id="tabs">
    <button class="tab active" data-tab="claim">My Claim</button>
    <button class="tab" data-tab="all">All Claims</button>
    <button class="tab" data-tab="rating">Disability Rating</button>
  </div>

  <div id="content">
    <p id="instructions">Navigate to your VA.gov claim status page first, then click this icon.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
